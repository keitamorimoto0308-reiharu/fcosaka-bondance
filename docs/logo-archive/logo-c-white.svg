<!-- 濃色背景用。logo-c.svg から自動生成。編集は元ファイル側で -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-label="サステナ盆踊り">
  <!--
    C案：踊りの輪
    盆踊りの本質は「櫓を囲んで輪になること」。その動きを、円周を回る人影で表す。
    人影は小さく描くと点に散るため、頭・胴・振り上げた腕まで入れて
    最小サイズでも人と読める大きさを確保している（5体に減らして1体を大きく）。
    輪は閉じきらず開口を残す——「加わる余地がある」ことの表現で、
    出店者を招く募集ページの主題と噛み合う。和のアクセントは最も強い。
  -->
  <defs>
    <style>
      .ink { fill: #FFFFFF; }
      .ja { font-family: 'Noto Sans JP', system-ui, sans-serif; font-weight: 700; }
      .en { font-family: 'Oswald', 'Noto Sans JP', sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- 輪：開口を残した弧 -->
  <path d="M209 22 A56 56 0 1 1 151 22" fill="none" stroke="#7FCAF1" stroke-width="9" stroke-linecap="round"/>

  <!-- 中央の櫓：屋根・高欄・柱・基壇。三角だけだと山に見えるため -->
  <g fill="#E0A882">
    <path d="M180 46 L203 63 Q180 59 157 63 Z"/>
    <rect x="160" y="66" width="40" height="4.6" rx="1"/>
    <rect x="164" y="71" width="4" height="19"/>
    <rect x="192" y="71" width="4" height="19"/>
    <path d="M157 90 L203 90 L198 96 L162 96 Z"/>
  </g>

  <!-- 踊り手：5体。頭・胴・振り上げた腕で人と読ませる -->
  <g fill="#FFFFFF">
    <g transform="translate(180 70)">
      <g id="c-dancer" transform="translate(0 -56) rotate(20)">
        <circle cx="0" cy="-7" r="6"/>
        <path d="M-5.5 0 L5.5 0 L4 15 L-4 15 Z"/>
        <path d="M-5 1 L-13 -9" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
        <path d="M5 1 L12 10" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      </g>
      <use href="#c-dancer" transform="rotate(72)"/>
      <use href="#c-dancer" transform="rotate(144)"/>
      <use href="#c-dancer" transform="rotate(216)"/>
      <use href="#c-dancer" transform="rotate(288)"/>
    </g>
  </g>

  <!-- ロゴタイプ -->
  <text x="180" y="163" text-anchor="middle" class="ja ink" font-size="27" letter-spacing="2">サステナ盆踊り</text>
  <text x="180" y="184" text-anchor="middle" class="en" fill="#CFC9C6" font-size="11" letter-spacing="4.6">SUSTAINA BON ODORI</text>
</svg>
