<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-label="サステナ盆踊り">
  <!--
    A案：クラブ基調
    FC大阪のエンブレムが円形なので、並べたときに親子に見える円形シルエットにする。
    櫓は「屋根＋高欄（手すり）＋四本柱＋基壇」の4要素で構成する。
    横線2本と柱だけだと鳥居（神社）に読めてしまうため、屋根に прямой勾配と
    基壇の台形を必ず入れて、櫓であることを確定させている。
    暖色は屋根の一点のみ。ブランド水色が主役。
    ロゴタイプは仮に live text。確定時にアウトライン化する。
  -->
  <defs>
    <style>
      .ink { fill: #231816; }
      .ja { font-family: 'Noto Sans JP', system-ui, sans-serif; font-weight: 700; }
      .en { font-family: 'Oswald', 'Noto Sans JP', sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- 外円：クラブエンブレムとの相似形 -->
  <circle cx="180" cy="70" r="55" fill="none" stroke="#7FCAF1" stroke-width="8"/>

  <g fill="#231816">
    <!-- 屋根：緩い反りのある勾配。鳥居の直線的な笠木と差をつける -->
    <path d="M180 30 L216 56 Q180 50 144 56 Z"/>
    <!-- 高欄（手すり）：櫓の最大の識別点 -->
    <rect x="148" y="60" width="64" height="6" rx="1"/>
    <!-- 四本柱：内側2本を短くして奥行きを出す -->
    <rect x="154" y="66" width="5" height="30"/>
    <rect x="201" y="66" width="5" height="30"/>
    <rect x="169" y="66" width="4" height="26"/>
    <rect x="187" y="66" width="4" height="26"/>
    <!-- 貫（横木） -->
    <rect x="154" y="79" width="52" height="3.4"/>
    <!-- 基壇：台形。地面に据わっていることを示す -->
    <path d="M146 96 L214 96 L206 104 L154 104 Z"/>
  </g>

  <!-- 屋根の頂点の灯。暖色はこの1点だけ -->
  <circle cx="180" cy="26" r="5" fill="#B5714C"/>

  <!-- ロゴタイプ -->
  <text x="180" y="163" text-anchor="middle" class="ja ink" font-size="27" letter-spacing="2">サステナ盆踊り</text>
  <text x="180" y="184" text-anchor="middle" class="en" fill="#6B6360" font-size="11" letter-spacing="4.6">SUSTAINA BON ODORI</text>
</svg>
